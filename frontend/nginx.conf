server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing fallback: if nginx can't find a real file at this
    # path (e.g. /chat/3f9a...), serve index.html instead and let React
    # Router take over from there. Without this, refreshing on any route
    # other than "/" 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets (Vite fingerprints these,
    # so it's safe to cache aggressively — a new build gets a new filename).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
