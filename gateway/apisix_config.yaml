routes:
  - id: ai-agent-api
    uri: /api/v1/*
    name: ai-agent-api
    priority: 0
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
      - HEAD
    upstream:
      type: roundrobin
      nodes:
        "ai-agent-service:8000": 1
      timeout:
        connect: 30
        send: 30
        read: 300
    plugins:
      cors:
        allow_origins: "http://localhost:5270,http://127.0.0.1:5270,http://frontend.local"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD"
        allow_headers: "Content-Type,Authorization,apikey,X-User-Id,Accept,Origin,X-Requested-With,DNT,User-Agent,If-Modified-Since,Cache-Control,Range"
        expose_headers: "Content-Length,Content-Type,Authorization,Content-Range"
        max_age: 3600
        allow_credential: true
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Proto: "http"
            X-Forwarded-Host: "apisix-gateway"
      limit-count:
        count: 100
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Too many requests. Please slow down."

  - id: ai-agent-auth
    uri: /api/auth/*
    name: ai-agent-auth
    priority: 0
    methods:
      - GET
      - POST
      - OPTIONS
      - HEAD
    upstream:
      type: roundrobin
      nodes:
        "ai-agent-service:8000": 1
      timeout:
        connect: 30
        send: 30
        read: 30
    plugins:
      cors:
        allow_origins: "http://localhost:5270,http://127.0.0.1:5270,http://frontend.local"
        allow_methods: "GET,POST,OPTIONS,HEAD"
        allow_headers: "Content-Type,Authorization,apikey,X-User-Id,Accept,Origin,X-Requested-With,DNT,User-Agent,If-Modified-Since,Cache-Control,Range"
        expose_headers: "Content-Length,Content-Type,Authorization,Content-Range"
        max_age: 3600
        allow_credential: true
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Proto: "http"
            X-Forwarded-Host: "apisix-gateway"
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Too many authentication attempts. Please slow down."

  - id: ai-agent-metrics
    uri: /metrics
    name: ai-agent-metrics
    methods:
      - GET
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "ai-agent-service:8000": 1
    plugins:
      cors:
        allow_origins: "http://localhost:5270,http://127.0.0.1:5270,http://frontend.local"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Content-Type,Authorization,apikey,X-User-Id,Accept,Origin"
        expose_headers: "Content-Length,Content-Type"
        max_age: 3600
        allow_credential: true

  - id: apisix-prometheus
    uri: /apisix/prometheus/metrics
    name: apisix-prometheus
    methods:
      - GET
      - OPTIONS
    plugins:
      public-api: {}
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Content-Type,Authorization"
        expose_headers: "Content-Length,Content-Type"
        max_age: 3600

  - id: health-check
    uri: /health
    name: health-check
    methods:
      - GET
      - OPTIONS
    upstream:
      type: roundrobin
      nodes:
        "ai-agent-service:8000": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Content-Type,Authorization"
        expose_headers: "Content-Length,Content-Type"
        max_age: 3600

#END